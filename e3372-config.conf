# /data/e3372-config.conf - E3372h modem configuration
# Edit this file to match your SIM card / operator.
# This file is preserved on reinstall.

# APN for your mobile operator
APN=mmsbouygtel.com

# Hosts pinged periodically (comma-separated) to check that traffic really
# flows through the data session. The check passes when any of them answers.
# If none answers, the watchdog re-dials the session, then cycles the radio,
# then suspends the check for 6 hours.
# Leave empty (PROBE_HOST=) to disable this check - do that if your operator
# or your APN filters ICMP, otherwise the watchdog will re-dial for nothing.
PROBE_HOST=8.8.8.8,1.1.1.1

# How far the recovery ladder may go when the modem is stuck (no AT answer,
# SIM missing or failed, registration lost or denied, dial refused, session
# without traffic). Each level includes the previous ones:
#   0 = observe and log only, never act
#   1 = network re-selection (AT+COPS=2 then AT+COPS=0)
#   2 = radio off/on cycle (AT+CFUN=0 then AT+CFUN=1)
#   3 = modem reset (AT+CFUN=1,1 - the modem re-enumerates on USB)
#   4 = USB port reset (de-authorize / re-authorize the device)
# A full ladder is followed by a growing pause (15 min doubling up to 4 h)
# before the next one. The GX itself is never rebooted.
RECOVERY_LEVEL=4

# Last-resort link watchdog: a small detached script that survives the modem
# service being killed. It does one thing only - power-cycle the modem's USB
# port when wwan0 has had no address and no default route for a long time -
# because every other recovery action needs a tty the modem no longer has.
# LINKWATCH=0 disables it.
LINKWATCH=1
LINKWATCH_DOWN_SECONDS=900

# When the modem is not on the USB bus at all, the port reset is impossible
# and only rebinding the USB controller can bring it back. That also
# re-enumerates the other devices of the same controller, so it stays opt-in.
LINKWATCH_HCI_RESET=0

# Time scale applied to every recovery delay (grace periods, settle times,
# pauses between ladders). 1.0 = nominal. Lower values (down to 0.1) shorten
# every delay: for tests only.
RECOVERY_TIMESCALE=1.0
